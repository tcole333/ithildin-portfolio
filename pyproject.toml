[project]
name = "ithildin"
version = "0.0.0"
description = "Ithildin investigative tooling platform."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4.4",
  "edgartools>=5.25.1",
  "neo4j>=6.1.0",
  "openpyxl>=3.1.5",
  "pandas>=3.0.1",
  "pyarrow>=23.0.1",
  "pytest>=8.3.5",
  "pyyaml>=6.0.3",
  "yfinance>=0.2.36",
]

[project.scripts]
ithildin = "ithildin.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ithildin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "integration: integration tests against script/CLI boundaries",
  "real_fixture: tests backed by fixtures derived from real project data",
  "live_data: tests that require live/local large data stores",
  "slow: slower-running tests",
]
